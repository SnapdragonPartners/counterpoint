# GoReleaser configuration; see README.md "Releases" and issue #27.
# Runs from .github/workflows/release.yml on a v* tag. Locally,
# `make snapshot` builds the same artifacts without publishing.
version: 2
project_name: counterpoint

before:
  hooks:
    - go mod tidy

builds:
  - id: counterpoint
    main: ./cmd/counterpoint
    binary: counterpoint
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The same variable the Makefile sets, so `counterpoint --version`
    # prints the tag.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - WORKFLOW-SAMPLE.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: SnapdragonPartners
    name: counterpoint

# A cask in the same tap directory Maestro uses. GoReleaser removed formula
# generation in v2.16. The binaries are not signed or notarized, and
# Homebrew quarantines cask downloads, which Gatekeeper then blocks, so the
# post-install hook GoReleaser documents for unsigned binaries clears the
# attribute. The tap token is the organization secret HOMEBREW_TAP_TOKEN, a
# fine-grained token with Contents read and write on homebrew-tap only.
homebrew_casks:
  - name: counterpoint
    directory: Casks
    repository:
      owner: SnapdragonPartners
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: Counterpoint CI
      email: counterpoint@snapdragonpartners.com
    homepage: "https://github.com/SnapdragonPartners/counterpoint"
    description: "MCP server that hands a coding agent's commits to a persistent Codex reviewer"
    binaries:
      - counterpoint
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/counterpoint"]
          end
