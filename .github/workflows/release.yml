name: Release

# Publishes binaries, checksums, and the Homebrew formula on a version
# tag. Tag from an approved main commit: `git tag -a vX.Y.Z -m ... && git
# push origin vX.Y.Z`. See .goreleaser.yaml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the previous tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Releases come only from commits already reviewed and merged into
      # main. A tag placed on any other commit fails here before anything
      # is built or published. fetch-depth 0 above makes origin/main
      # available.
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main; releases are cut only from main"
            exit 1
          fi

      # CI already checked the commit on its way into main; re-running is
      # cheap insurance that the release build sees the same result.
      - name: Check
        run: make check

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
